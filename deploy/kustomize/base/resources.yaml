apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-web
  labels:
    app: personal-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: personal-web
  template:
    metadata:
      labels:
        app: personal-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: YOUR_IMAGE_REPOSITORY:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: personal-web
  labels:
    app: personal-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: personal-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personal-web
  labels:
    app: personal-web
spec:
  rules:
    - host: personal-web.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: personal-web
                port:
                  number: 80
