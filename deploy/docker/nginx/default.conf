server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ocultar versión de NGINX (Seguridad / Information Disclosure)
    server_tokens off;

    # Compresión Gzip optimizada
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # Cache agresivo para assets inmutables de Next.js (_next/static)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Cache moderado para imágenes públicas y favicons
    location ~* \.(ico|svg|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/security-headers.conf;
    }

    # Enrutamiento de páginas estáticas con fallback a index.html y 404
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Endpoint para liveness y readiness probes de Kubernetes
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
}
