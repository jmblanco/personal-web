name: Deploy to GitHub Pages (jmblanco.github.io)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject custom profile configuration (if secret present)
        env:
          CUSTOM_PROFILE_B64: ${{ secrets.CUSTOM_PROFILE_B64 }}
          CUSTOM_CAREER_B64: ${{ secrets.CUSTOM_CAREER_B64 }}
          CUSTOM_PROJECTS_B64: ${{ secrets.CUSTOM_PROJECTS_B64 }}
        run: |
          node -e '
            const fs = require("fs");
            const inject = (envVar, filePath) => {
              const val = process.env[envVar];
              if (!val || !val.trim()) {
                console.log(envVar + " is not set or empty. Skipping.");
                return;
              }
              try {
                const cleaned = val.replace(/[^A-Za-z0-9+/=]/g, "");
                const decoded = Buffer.from(cleaned, "base64").toString("utf-8");
                fs.writeFileSync(filePath, decoded, "utf-8");
                console.log("Successfully injected " + filePath + " from " + envVar + " (" + decoded.length + " bytes)");
              } catch (err) {
                console.error("Failed to decode " + envVar + ":", err);
                process.exit(1);
              }
            };

            inject("CUSTOM_PROFILE_B64", "content/profile.ts");
            inject("CUSTOM_CAREER_B64", "content/career.ts");
            inject("CUSTOM_PROJECTS_B64", "content/projects.ts");
          '

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Deploy to jmblanco.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          external_repository: jmblanco/jmblanco.github.io
          publish_branch: main
          publish_dir: ./out
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: sync from personal-web (${{ github.sha }})"
