name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Inject custom profile configuration (if secret present)
        env:
          CUSTOM_PROFILE_B64: ${{ secrets.CUSTOM_PROFILE_B64 }}
          CUSTOM_CAREER_B64: ${{ secrets.CUSTOM_CAREER_B64 }}
          CUSTOM_PROJECTS_B64: ${{ secrets.CUSTOM_PROJECTS_B64 }}
        run: |
          node -e '
            const fs = require("fs");
            const inject = (envVar, filePath) => {
              const val = process.env[envVar];
              if (!val || !val.trim()) {
                console.log(envVar + " is not set or empty. Skipping.");
                return;
              }
              try {
                const cleaned = val.replace(/[^A-Za-z0-9+/=]/g, "");
                const decoded = Buffer.from(cleaned, "base64").toString("utf-8");
                fs.writeFileSync(filePath, decoded, "utf-8");
                console.log("Successfully injected " + filePath + " from " + envVar + " (" + decoded.length + " bytes)");
              } catch (err) {
                console.error("Failed to decode " + envVar + ":", err);
                process.exit(1);
              }
            };

            inject("CUSTOM_PROFILE_B64", "content/profile.ts");
            inject("CUSTOM_CAREER_B64", "content/career.ts");
            inject("CUSTOM_PROJECTS_B64", "content/projects.ts");
          '

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.configure-pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
